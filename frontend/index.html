<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="拾光 · 用课程表的方式安排日程与固定日常" />
    <title>拾光 · 日程管理</title>
    <script>
      // 配合 public/404.html：GitHub Pages 深链接刷新后恢复原始路由
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect')
        if (redirect && location.pathname === '/shiguang/') {
          sessionStorage.removeItem('spa-redirect')
          history.replaceState(null, '', '/shiguang' + redirect)
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
